# BATMAN-adv Edge Node Configuration Template
# GridDown Mesh Network
#
# This template is for edge nodes at houses/locations that:
# - Connect to the mesh via backhaul
# - Provide WiFi access for local client devices
# Adjust values marked with {{VARIABLE}} before deployment.
#
# Node: Edge (end-point with client access)
# Protocol: BATMAN-adv
# Hardware: Dual-radio OpenWRT router preferred

#==============================================================================
# CONFIGURATION VARIABLES
#==============================================================================
# Replace these before applying:
#
# {{HOSTNAME}}       - Node hostname, e.g., gd-edge-smith-01
# {{MESH_IP}}        - This node's mesh IP, e.g., 10.73.100.1
# {{GATEWAY_IP}}     - Gateway node IP, e.g., 10.73.0.1
# {{MESH_SSID}}      - Mesh network SSID (must match gateway)
# {{MESH_KEY}}       - Mesh WPA key (must match gateway)
# {{MESH_CHANNEL}}   - Mesh backhaul channel (must match gateway)
# {{CLIENT_SSID}}    - Client WiFi SSID, e.g., GridDown-Smith
# {{CLIENT_KEY}}     - Client WiFi password
# {{CLIENT_CHANNEL}} - Client AP channel (can differ if dual-radio)

#==============================================================================
# /etc/config/system
#==============================================================================
config system
    option hostname '{{HOSTNAME}}'
    option timezone 'UTC'
    option ttylogin '0'
    option log_size '64'
    option urandom_seed '0'

config timeserver 'ntp'
    option enabled '0'

#==============================================================================
# /etc/config/network
#==============================================================================

config interface 'loopback'
    option device 'lo'
    option proto 'static'
    option ipaddr '127.0.0.1'
    option netmask '255.0.0.0'

# BATMAN-adv mesh interface
config interface 'bat0'
    option proto 'batadv'
    option routing_algo 'BATMAN_IV'
    option aggregated_ogms '1'
    option ap_isolation '0'
    option bonding '0'
    option bridge_loop_avoidance '1'
    option distributed_arp_table '1'
    option fragmentation '1'
    option gw_mode 'client'
    option gw_sel_class '20'
    option hop_penalty '30'
    option log_level '0'
    option multicast_mode '1'
    option orig_interval '1000'

# Mesh backhaul interface
config interface 'mesh0'
    option proto 'batadv_hardif'
    option master 'bat0'
    option mtu '1560'

# LAN bridge (batman + client AP)
config device
    option name 'br-lan'
    option type 'bridge'
    list ports 'bat0'
    # Client AP (wlan1 or similar) will auto-join via network assignment

config interface 'lan'
    option device 'br-lan'
    option proto 'static'
    option ipaddr '{{MESH_IP}}'
    option netmask '255.255.0.0'
    option gateway '{{GATEWAY_IP}}'
    option dns '{{GATEWAY_IP}}'

#==============================================================================
# /etc/config/wireless
#==============================================================================

# Radio 0: Mesh backhaul (2.4 GHz or HaLow)
config wifi-device 'radio0'
    option type 'mac80211'
    option channel '{{MESH_CHANNEL}}'
    option hwmode '11g'
    option path 'platform/10300000.wmac'
    option htmode 'HT20'
    option disabled '0'
    option country 'US'

config wifi-iface 'mesh_backhaul'
    option device 'radio0'
    option network 'mesh0'
    option mode 'mesh'
    option mesh_id '{{MESH_SSID}}'
    option mesh_fwding '0'
    option encryption 'sae'
    option key '{{MESH_KEY}}'

# Radio 1: Client access (5 GHz preferred if available)
# If single-radio device, put client AP on radio0 (reduces backhaul capacity)
config wifi-device 'radio1'
    option type 'mac80211'
    option channel '{{CLIENT_CHANNEL}}'
    option hwmode '11a'
    option path 'pci0000:00/0000:00:00.0/0000:01:00.0'
    option htmode 'VHT80'
    option disabled '0'
    option country 'US'

config wifi-iface 'client_ap'
    option device 'radio1'
    option network 'lan'
    option mode 'ap'
    option ssid '{{CLIENT_SSID}}'
    option encryption 'sae-mixed'
    option key '{{CLIENT_KEY}}'
    option isolate '0'
    option wps_pushbutton '0'

#==============================================================================
# /etc/config/dhcp
#==============================================================================

# Edge node does NOT run DHCP server
# Clients get DHCP from gateway via mesh

config dnsmasq
    option domainneeded '1'
    option localise_queries '1'
    option local '/griddown.local/'
    option domain 'griddown.local'
    option expandhosts '1'
    option authoritative '0'
    option leasefile '/tmp/dhcp.leases'
    option localservice '1'

config dhcp 'lan'
    option interface 'lan'
    option ignore '1'

#==============================================================================
# /etc/config/firewall
#==============================================================================

config defaults
    option syn_flood '1'
    option input 'ACCEPT'
    option output 'ACCEPT'
    option forward 'ACCEPT'
    option flow_offloading '1'

config zone
    option name 'lan'
    option input 'ACCEPT'
    option output 'ACCEPT'
    option forward 'ACCEPT'
    list network 'lan'

#==============================================================================
# SINGLE-RADIO VARIANT
#==============================================================================
# If using a single-radio device, remove radio1 section and modify radio0:
#
# config wifi-device 'radio0'
#     option type 'mac80211'
#     option channel '{{MESH_CHANNEL}}'
#     option hwmode '11g'
#     option htmode 'HT20'
#     option disabled '0'
#     option country 'US'
#
# config wifi-iface 'mesh_backhaul'
#     option device 'radio0'
#     option network 'mesh0'
#     option mode 'mesh'
#     option mesh_id '{{MESH_SSID}}'
#     option mesh_fwding '0'
#     option encryption 'sae'
#     option key '{{MESH_KEY}}'
#
# config wifi-iface 'client_ap'
#     option device 'radio0'
#     option network 'lan'
#     option mode 'ap'
#     option ssid '{{CLIENT_SSID}}'
#     option encryption 'sae-mixed'
#     option key '{{CLIENT_KEY}}'
#
# Note: Single-radio reduces capacity as mesh and client share airtime

#==============================================================================
# DEPLOYMENT SCRIPT
#==============================================================================
# Save as deploy-edge.sh:
#
# #!/bin/bash
# set -e
#
# echo "Installing required packages..."
# opkg update
# opkg install kmod-batman-adv batctl
#
# echo "Applying configuration..."
# # Copy config files to /etc/config/
#
# echo "Starting services..."
# /etc/init.d/network restart
#
# echo "Waiting for mesh convergence..."
# sleep 15
#
# echo "Verifying mesh..."
# batctl if
# batctl n
# batctl gwl
#
# echo "Testing connectivity..."
# ping -c 3 {{GATEWAY_IP}}
# ping -c 3 10.73.0.2
#
# echo "Verifying client AP..."
# iwinfo
#
# echo "Edge deployment complete!"

#==============================================================================
# VERIFICATION COMMANDS
#==============================================================================
#
# # Check batman interfaces
# batctl if
#
# # Check neighbors (should see relay or other nodes)
# batctl n
#
# # Check gateway
# batctl gwl
#
# # Check client AP is broadcasting
# iwinfo
#
# # Test client connectivity (from connected device):
# # 1. Connect to {{CLIENT_SSID}}
# # 2. Should receive IP in 10.73.200.x range
# # 3. ping 10.73.0.2 (server)
# # 4. curl http://griddown.local/
