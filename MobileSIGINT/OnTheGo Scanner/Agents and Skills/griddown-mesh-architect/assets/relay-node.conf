# BATMAN-adv Relay Node Configuration Template
# GridDown Mesh Network
#
# This template is for relay nodes that extend mesh coverage.
# Relay nodes do NOT provide DHCP - they forward to the gateway.
# Adjust values marked with {{VARIABLE}} before deployment.
#
# Node: Relay (extends mesh coverage)
# Protocol: BATMAN-adv
# Hardware: OpenWRT router or Pi Zero 2W with HaLow radio

#==============================================================================
# CONFIGURATION VARIABLES
#==============================================================================
# Replace these before applying:
#
# {{HOSTNAME}}      - Node hostname, e.g., gd-relay-north-01
# {{MESH_IP}}       - This node's mesh IP, e.g., 10.73.1.1
# {{GATEWAY_IP}}    - Gateway node IP, e.g., 10.73.0.1
# {{MESH_SSID}}     - Mesh network SSID (must match gateway)
# {{MESH_KEY}}      - WPA3/WPA2 pre-shared key (must match gateway)
# {{RADIO_CHANNEL}} - WiFi channel (must match gateway)

#==============================================================================
# /etc/config/system
#==============================================================================
config system
    option hostname '{{HOSTNAME}}'
    option timezone 'UTC'
    option ttylogin '0'
    option log_size '64'
    option urandom_seed '0'

config timeserver 'ntp'
    option enabled '0'

#==============================================================================
# /etc/config/network
#==============================================================================

config interface 'loopback'
    option device 'lo'
    option proto 'static'
    option ipaddr '127.0.0.1'
    option netmask '255.0.0.0'

# BATMAN-adv mesh interface
config interface 'bat0'
    option proto 'batadv'
    option routing_algo 'BATMAN_IV'
    option aggregated_ogms '1'
    option ap_isolation '0'
    option bonding '0'
    option bridge_loop_avoidance '1'
    option distributed_arp_table '1'
    option fragmentation '1'
    option gw_mode 'client'
    option gw_sel_class '20'
    option hop_penalty '30'
    option log_level '0'
    option multicast_mode '1'
    option orig_interval '1000'

# Mesh backhaul interface (added to batman)
config interface 'mesh0'
    option proto 'batadv_hardif'
    option master 'bat0'
    option mtu '1560'

# LAN bridge (batman only - relay doesn't need ethernet bridge)
config device
    option name 'br-lan'
    option type 'bridge'
    list ports 'bat0'

config interface 'lan'
    option device 'br-lan'
    option proto 'static'
    option ipaddr '{{MESH_IP}}'
    option netmask '255.255.0.0'
    option gateway '{{GATEWAY_IP}}'
    option dns '{{GATEWAY_IP}}'

#==============================================================================
# /etc/config/wireless
#==============================================================================

config wifi-device 'radio0'
    option type 'mac80211'
    option channel '{{RADIO_CHANNEL}}'
    option hwmode '11g'
    option path 'platform/10300000.wmac'
    option htmode 'HT20'
    option disabled '0'
    option country 'US'

# Mesh backhaul interface (802.11s)
config wifi-iface 'mesh_backhaul'
    option device 'radio0'
    option network 'mesh0'
    option mode 'mesh'
    option mesh_id '{{MESH_SSID}}'
    option mesh_fwding '0'
    option encryption 'sae'
    option key '{{MESH_KEY}}'

#==============================================================================
# /etc/config/dhcp
#==============================================================================

# Relay node does NOT run DHCP server
# All DHCP is handled by gateway node

config dnsmasq
    option domainneeded '1'
    option localise_queries '1'
    option local '/griddown.local/'
    option domain 'griddown.local'
    option expandhosts '1'
    option authoritative '0'
    option leasefile '/tmp/dhcp.leases'
    option localservice '1'

config dhcp 'lan'
    option interface 'lan'
    option ignore '1'

#==============================================================================
# /etc/config/firewall
#==============================================================================

config defaults
    option syn_flood '1'
    option input 'ACCEPT'
    option output 'ACCEPT'
    option forward 'ACCEPT'
    option flow_offloading '1'

config zone
    option name 'lan'
    option input 'ACCEPT'
    option output 'ACCEPT'
    option forward 'ACCEPT'
    list network 'lan'

#==============================================================================
# DEPLOYMENT SCRIPT
#==============================================================================
# Save as deploy-relay.sh and run on the relay node:
#
# #!/bin/bash
# set -e
#
# echo "Installing required packages..."
# opkg update
# opkg install kmod-batman-adv batctl
#
# echo "Applying configuration..."
# # Copy config files to /etc/config/
#
# echo "Enabling and starting services..."
# /etc/init.d/network restart
#
# echo "Waiting for mesh convergence..."
# sleep 10
#
# echo "Verifying mesh..."
# batctl if
# batctl n
# batctl gwl
#
# echo "Testing gateway connectivity..."
# ping -c 3 {{GATEWAY_IP}}
#
# echo "Relay deployment complete!"

#==============================================================================
# VERIFICATION COMMANDS
#==============================================================================
# Run these after deployment:
#
# # Check batman interfaces
# batctl if
# # Expected: mesh0: active
#
# # Check neighbors (should show at least one other mesh node)
# batctl n
#
# # Check gateway list (should show gateway node)
# batctl gwl
#
# # Verify we selected a gateway
# batctl gw
#
# # Test connectivity to gateway
# ping -c 3 {{GATEWAY_IP}}
#
# # Test connectivity to server (through mesh)
# ping -c 3 10.73.0.2
