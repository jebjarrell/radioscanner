# BATMAN-adv Gateway Node Configuration Template
# GridDown Mesh Network
#
# This template is for the main gateway node connected to the GridDown server.
# Adjust values marked with {{VARIABLE}} before deployment.
#
# Node: Gateway (connects mesh to server)
# Protocol: BATMAN-adv
# Hardware: HaLowLink 1 or compatible OpenWRT router

#==============================================================================
# CONFIGURATION VARIABLES
#==============================================================================
# Replace these before applying:
#
# {{HOSTNAME}}      - Node hostname, e.g., gd-gateway-main
# {{MESH_IP}}       - This node's mesh IP, e.g., 10.73.0.1
# {{SERVER_IP}}     - GridDown server IP, e.g., 10.73.0.2
# {{MESH_SSID}}     - Mesh network SSID, e.g., GD-Mesh-Oak
# {{MESH_KEY}}      - WPA3/WPA2 pre-shared key for mesh
# {{CLIENT_SSID}}   - Client WiFi SSID, e.g., GridDown-Oak
# {{CLIENT_KEY}}    - Client WiFi password
# {{RADIO_CHANNEL}} - WiFi channel (1, 6, or 11 for 2.4GHz)

#==============================================================================
# /etc/config/system
#==============================================================================
config system
    option hostname '{{HOSTNAME}}'
    option timezone 'UTC'
    option ttylogin '0'
    option log_size '64'
    option urandom_seed '0'

config timeserver 'ntp'
    option enabled '0'
    # NTP disabled for offline operation

#==============================================================================
# /etc/config/network
#==============================================================================

config interface 'loopback'
    option device 'lo'
    option proto 'static'
    option ipaddr '127.0.0.1'
    option netmask '255.0.0.0'

# BATMAN-adv mesh interface
config interface 'bat0'
    option proto 'batadv'
    option routing_algo 'BATMAN_IV'
    option aggregated_ogms '1'
    option ap_isolation '0'
    option bonding '0'
    option bridge_loop_avoidance '1'
    option distributed_arp_table '1'
    option fragmentation '1'
    option gw_mode 'server'
    option gw_bandwidth '100000/100000'
    option hop_penalty '30'
    option log_level '0'
    option multicast_mode '1'
    option orig_interval '1000'

# Mesh backhaul interface (added to batman)
config interface 'mesh0'
    option proto 'batadv_hardif'
    option master 'bat0'
    option mtu '1560'

# LAN bridge (ethernet + batman mesh)
config device
    option name 'br-lan'
    option type 'bridge'
    list ports 'eth0'
    list ports 'bat0'

config interface 'lan'
    option device 'br-lan'
    option proto 'static'
    option ipaddr '{{MESH_IP}}'
    option netmask '255.255.0.0'
    # No gateway - this IS the gateway

#==============================================================================
# /etc/config/wireless
#==============================================================================

config wifi-device 'radio0'
    option type 'mac80211'
    option channel '{{RADIO_CHANNEL}}'
    option hwmode '11g'
    option path 'platform/10300000.wmac'
    option htmode 'HT20'
    option disabled '0'
    option country 'US'

# Mesh backhaul interface (802.11s)
config wifi-iface 'mesh_backhaul'
    option device 'radio0'
    option network 'mesh0'
    option mode 'mesh'
    option mesh_id '{{MESH_SSID}}'
    option mesh_fwding '0'
    option encryption 'sae'
    option key '{{MESH_KEY}}'

# Client access point (optional on same radio)
# For dual-radio devices, put on radio1
config wifi-iface 'client_ap'
    option device 'radio0'
    option network 'lan'
    option mode 'ap'
    option ssid '{{CLIENT_SSID}}'
    option encryption 'sae-mixed'
    option key '{{CLIENT_KEY}}'
    option isolate '0'

#==============================================================================
# /etc/config/dhcp
#==============================================================================

config dnsmasq
    option domainneeded '1'
    option localise_queries '1'
    option local '/griddown.local/'
    option domain 'griddown.local'
    option expandhosts '1'
    option authoritative '1'
    option readethers '1'
    option leasefile '/tmp/dhcp.leases'
    option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'
    option localservice '1'

config dhcp 'lan'
    option interface 'lan'
    option start '200'
    option limit '822'
    option leasetime '12h'
    option ra_slaac '1'
    list ra_flags 'managed-config'
    list ra_flags 'other-config'
    # Point clients to server for DNS
    list dhcp_option '6,{{SERVER_IP}}'

# Static host entries
config host
    option name 'server'
    option dns '1'
    option ip '{{SERVER_IP}}'

config domain
    option name 'griddown.local'
    option ip '{{SERVER_IP}}'

config domain
    option name 'server.griddown.local'
    option ip '{{SERVER_IP}}'

#==============================================================================
# /etc/config/firewall
#==============================================================================

config defaults
    option syn_flood '1'
    option input 'ACCEPT'
    option output 'ACCEPT'
    option forward 'ACCEPT'
    option flow_offloading '1'

config zone
    option name 'lan'
    option input 'ACCEPT'
    option output 'ACCEPT'
    option forward 'ACCEPT'
    list network 'lan'

#==============================================================================
# DEPLOYMENT SCRIPT
#==============================================================================
# Save this section as a separate script: deploy-gateway.sh
# Run on the gateway node after flashing OpenWRT
#
# #!/bin/bash
# set -e
#
# echo "Installing required packages..."
# opkg update
# opkg install kmod-batman-adv batctl
#
# echo "Applying configuration..."
# # Copy config files to /etc/config/
#
# echo "Enabling and starting services..."
# /etc/init.d/network restart
#
# echo "Verifying mesh..."
# sleep 5
# batctl if
# batctl n
#
# echo "Gateway deployment complete!"

#==============================================================================
# VERIFICATION COMMANDS
#==============================================================================
# Run these after deployment to verify operation:
#
# # Check batman interfaces
# batctl if
# # Expected: mesh0: active
#
# # Check neighbors (should show relay/edge nodes)
# batctl n
#
# # Check originators (full mesh topology)
# batctl o
#
# # Verify IP configuration
# ip addr show br-lan
#
# # Test connectivity to server
# ping -c 3 {{SERVER_IP}}
#
# # Check DHCP leases
# cat /tmp/dhcp.leases
